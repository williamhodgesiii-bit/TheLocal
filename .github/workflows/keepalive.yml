# Keeps the free Supabase project awake. Free projects pause after a week with no
# activity, and a paused project means nobody can sign in. This pings the site's
# /api/health (which touches the database and sign-in) every three days. Free:
# a few seconds of Actions time per run.
name: Keep the database awake

on:
  schedule:
    - cron: "41 15 */3 * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write # lets the last step keep this schedule switched on

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the database through the site
        run: |
          for i in 1 2 3; do
            body=$(curl -fsS --max-time 30 https://www.theplatenextdoor.com/api/health) && { echo "$body"; exit 0; }
            sleep 20
          done
          echo "Health check failed. If the Supabase project shows as paused, press Restore in its dashboard."
          exit 1
      - name: Email the team about any added place that slipped through
        run: curl -sS --max-time 60 -X POST https://www.theplatenextdoor.com/api/notify || true
      # GitHub pauses scheduled jobs after 60 days without repository activity.
      # Re-enabling the job on every run resets that clock, so it never stops.
      - name: Keep this schedule switched on
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable"

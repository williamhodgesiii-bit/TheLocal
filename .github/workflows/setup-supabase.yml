# One tap sets up Supabase: database, sign-in settings, the free email sender and the
# sign-in email. Actions → "Set up Supabase" → Run workflow → paste your Project URL.
# Needs the SUPABASE_ACCESS_TOKEN secret (and RESEND_API_KEY for email). Safe to run again.
name: Set up Supabase

on:
  workflow_dispatch:
    inputs:
      project:
        description: "Your Supabase Project URL (https://….supabase.co)"
        required: true
      google_client_id:
        description: "Optional: Google OAuth Client ID (needs the GOOGLE_CLIENT_SECRET secret)"
        required: false

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up the database and sign-in
        env:
          PROJECT: ${{ inputs.project }}
          GOOGLE_CLIENT_ID: ${{ inputs.google_client_id }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: node scripts/setup-supabase.mjs

# Temporary, on the site-probe branch only: read-only check of the live site and database.
name: Site probe
on:
  push:
    branches: [site-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node probe/site.mjs

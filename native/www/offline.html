<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline · The Plate Next Door</title>
    <style>
      :root { color-scheme: light; }
      html, body { margin: 0; height: 100%; }
      body {
        display: grid; place-content: center; gap: 14px; padding: max(24px, env(safe-area-inset-top)) 28px max(24px, env(safe-area-inset-bottom));
        background: #f4efe1; color: #22201c; text-align: center;
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      }
      .mark { width: 72px; height: 72px; margin: 0 auto; border-radius: 50%; background: #fbf8ef; border: 3px double #22201c; display: grid; place-items: center; }
      .mark span { width: 22px; height: 28px; border-radius: 11px 11px 2px 2px; background: #b23a24; }
      h1 { margin: 0; font: 400 30px/1.1 Georgia, "Times New Roman", serif; }
      p { margin: 0; color: #3d3a33; max-width: 22em; }
      button { justify-self: center; min-height: 48px; padding: 0 26px; border: 0; border-radius: 10px; background: #2c5a43; color: #fff; font: 600 16px/1 inherit; }
    </style>
  </head>
  <body>
    <div class="mark" aria-hidden="true"><span></span></div>
    <h1>No connection</h1>
    <p>The Plate Next Door needs the internet to show places, reviews and your friends. Check your signal or Wi-Fi.</p>
    <button type="button" onclick="location.href = 'https://www.theplatenextdoor.com/'">Try again</button>
  </body>
</html>
